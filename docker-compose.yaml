

services:

  frontend:
    image: nayancheruvusameera/fullstack-frontend:v1
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-con
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_URL: "http://backend:5000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: nayancheruvusameera/fullstack-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-con
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
