
services:

  frontend:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USER}/fullstack-frontend:v1
    container_name: frontend-con
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USER}/fullstack-backend:v1
    container_name: backend-con
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
